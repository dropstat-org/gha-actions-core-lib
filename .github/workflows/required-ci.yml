name: Required CI

# Governance gate referenced by the org ruleset "Required CI workflow".
#
# GitHub required-workflows run the referenced file as a top-level workflow in
# each target repo, injecting the events below. The reusable pipeline-ci.yml
# cannot run standalone (its runs-on reads inputs.runner, which is null outside
# workflow_call), so this thin wrapper calls it instead.
#
# On pull_request the library decides what runs per repo type:
#   - app  -> no stages (build-once already gated on the feature push) => fast no-op
#   - tf   -> plan + checks
# A dev cannot bypass the pipeline by adding their own workflow: this one is
# injected org-wide by the ruleset and always runs the library's logic.
#
# `push` is here for one reason: the ruleset rule that requires this workflow is
# evaluated on EVERY ref update, pushes included. A workflow that does not list
# `push` can never have run for the commit a push is trying to land, so the rule
# is unsatisfiable and the push is rejected with GH013 - no matter how green the
# repo's own CI is. `do_not_enforce_on_create = true` hid it: the first push of a
# new branch is exempt, so the deadlock only appeared on the SECOND commit, and
# the workaround (new branch per commit, or a draft PR to force a pull_request
# event) is not a way to work.
#
# The `ci` job below is deliberately NOT run on push - see the comment there.
on:
  pull_request:
  push:
  workflow_dispatch:

# On pull_request, serialize with the repo's own pipeline-ci/pipeline-cd (same
# group) so the required-CI plan never runs concurrently with a deploy and
# collides on the terraform state lock.
#
# On push it must NOT join that group: this run is what unblocks the developer's
# NEXT push, so queuing it behind a long terraform apply would block them for as
# long as the apply takes. It shares no state with anything, so it needs no lock.
concurrency:
  group: ${{ github.event_name == 'push' && format('required-ci-push-{0}-{1}', github.repository, github.ref) || format('tf-{0}', github.repository) }}
  cancel-in-progress: false

# GitHub validates ALL permissions declared by ANY job in the called reusable at
# startup (even jobs skipped at runtime) — they must be granted here or the run
# fails with startup_failure. Match the reusable pipeline-ci.yml job permissions.
permissions:
  id-token:        write
  contents:        write
  packages:        write
  security-events: write
  actions:         write   # trigger_cd job in pipeline-ci needs it (else startup_failure)

jobs:
  # Not on push. pipeline-ci.yml gates its `trigger_cd` job on
  # `github.event_name == 'push'`, and in a reusable workflow that reads the
  # CALLER's event - so running this on push would mean the repo's own
  # pipeline-ci AND this one both executing the full pipeline for the same
  # commit, and both dispatching a CD. Two deploys per merge, and double the
  # runner cost on a fleet that is already the bottleneck.
  #
  # Skipping it costs nothing: on push the repo's own pipeline-ci does the real
  # work, and this workflow only has to CONCLUDE successfully for the ruleset to
  # be satisfied - which run-name-check below is enough to do. The governance
  # gate itself is unchanged, because it always lived on the pull_request path.
  ci:
    if: github.event_name != 'push'
    uses: dropstat-org/gha-actions-core-lib/.github/workflows/pipeline-ci.yml@main
    secrets: inherit
    with:
      # Private repos get the self-hosted fleet, as always. PUBLIC repos must not:
      # the org's "Default" runner group has allows_public_repositories = false, so
      # GitHub never assigns a self-hosted runner to them and the job sits queued
      # until the queue timeout marks the run `cancelled`. Since this workflow is
      # injected org-wide by the ruleset, that leaves the required check permanently
      # pending on every PR of a public repo - gha-actions-core-lib is the one we
      # have today, and it is where this was found.
      #
      # Flipping the runner group to allow public repos is the alternative, and it
      # is the wrong one: it lets a pull request from any fork run arbitrary code on
      # runners that live inside the VPC.
      runner: ${{ github.event.repository.private && '["self-hosted","aws","dropstat"]' || '["ubuntu-latest"]' }}

  # Guards against pipeline-cd.yml's run-name block drifting from the safe
  # pattern (see scripts/check-run-name.py for the full rationale: run-name
  # can't live in the reusable workflow, so every app repo hand-copies it, and
  # that copy silently rotting is exactly what caused dropstat-desktop-app's
  # manual-dispatch title to lose its source-branch disambiguation).
  run-name-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout gha-actions-core-lib (for the check script)
        uses: actions/checkout@v4
        with:
          repository: dropstat-org/gha-actions-core-lib
          path: .gha-actions-core-lib
          sparse-checkout: scripts

      - name: Check pipeline-cd.yml run-name
        run: python3 .gha-actions-core-lib/scripts/check-run-name.py
