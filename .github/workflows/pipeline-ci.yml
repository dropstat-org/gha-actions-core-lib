name: Pipeline CI

# Reusable CI half of the pipeline (build / test / checks / publish for app repos;
# plan + checks for terraform repos). The deploy half lives in pipeline-cd.yml.
#
# The library's config stage runs with PIPELINE_PHASE=ci, which intersects the
# branch-allowed stages with the CI set (drops deploy/release/ecs_deploy).
# Stage selection still respects branch type and action.yaml — same library logic.

on:
  workflow_call:
    inputs:
      branching_strategy:
        description: "gitflow (default) or trunk"
        type: string
        required: false
        default: ""
      runner:
        description: "Runner label(s) — defaults to ubuntu-latest. Pass a JSON array string for self-hosted (e.g. '[\"self-hosted\",\"aws\",\"dropstat\"]')."
        type: string
        required: false
        default: '["self-hosted","aws","dropstat"]'
      force_build:
        description: "Opt-in override: compile+publish even on a release/** push (build-once bypass for that push only). Default false preserves build-once for everyone."
        type: boolean
        required: false
        default: false
  workflow_dispatch:
  pull_request:

jobs:
  config:
    name: Config
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    env:
      PIPELINE_PHASE: ci
      BRANCHING_STRATEGY: ${{ inputs.branching_strategy }}
      FORCE_BUILD_OVERRIDE: ${{ inputs.force_build }}
    outputs:
      compile_enabled:    ${{ steps.cfg.outputs.compile_enabled }}
      unit_test_enabled:  ${{ steps.cfg.outputs.unit_test_enabled }}
      linter_enabled:     ${{ steps.cfg.outputs.linter_enabled }}
      semgrep_enabled:    ${{ steps.cfg.outputs.semgrep_enabled }}
      sonarqube_enabled:  ${{ steps.cfg.outputs.sonarqube_enabled }}
      trivy_enabled:      ${{ steps.cfg.outputs.trivy_enabled }}
      checkov_enabled:    ${{ steps.cfg.outputs.checkov_enabled }}
      checkov_tf_enabled: ${{ steps.cfg.outputs.checkov_tf_enabled }}
      plan_enabled:       ${{ steps.cfg.outputs.plan_enabled }}
      publish_enabled:    ${{ steps.cfg.outputs.publish_enabled }}
      generic_enabled:    ${{ steps.cfg.outputs.generic_enabled }}
      tools_java:         ${{ steps.cfg.outputs.tools_java }}
      tools_maven:        ${{ steps.cfg.outputs.tools_maven }}
      tools_node:         ${{ steps.cfg.outputs.tools_node }}
      tools_flutter:      ${{ steps.cfg.outputs.tools_flutter }}
      tools_terraform:    ${{ steps.cfg.outputs.tools_terraform }}
      tools_terragrunt:   ${{ steps.cfg.outputs.tools_terragrunt }}
      ActionsCoreLib_type: ${{ steps.cfg.outputs.ActionsCoreLib_type }}
    steps:
      - uses: actions/checkout@v4.2.2
      - id: cfg
        uses: dropstat-org/gha-actions-core-lib@main
        with:
          stage: config

  # ── App / Library build stages ──────────────────────────────────────────────

  compile:
    name: Compile
    needs: config
    if: needs.config.outputs.compile_enabled == 'true'
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Setup Java
        if: needs.config.outputs.tools_java != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ needs.config.outputs.tools_java }}
      - name: Setup Maven
        if: needs.config.outputs.tools_maven != ''
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: ${{ needs.config.outputs.tools_maven }}
      - name: Setup Flutter
        if: needs.config.outputs.tools_flutter != ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.config.outputs.tools_flutter }}
          cache: true
      - uses: dropstat-org/gha-actions-core-lib@main
        with:
          stage: compile
      # Share compiled classes so the SonarQube job (separate workspace) can run
      # the Java/JVM sensor (needs sonar.java.binaries), and share the built jar
      # so the Publish job's Docker build doesn't have to recompile from scratch.
      # No-op for non-JVM repos.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compile-output
          path: |
            target/classes
            build/classes
            target/*.jar
            build/libs/*.jar
          if-no-files-found: ignore
          retention-days: 1

  unit_test:
    name: Unit Test
    needs: [config, compile]
    if: |
      always() &&
      needs.config.outputs.unit_test_enabled == 'true' &&
      (needs.compile.result == 'success' || needs.compile.result == 'skipped')
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dropstat-org/gha-actions-core-lib@main
        with:
          stage: unit_test

  linter:
    name: Linter
    needs: [config, compile]
    if: |
      always() &&
      needs.config.outputs.linter_enabled == 'true' &&
      (needs.compile.result == 'success' || needs.compile.result == 'skipped')
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dropstat-org/gha-actions-core-lib@main
        with:
          stage: linter

  semgrep:
    name: Semgrep
    needs: [config, compile]
    if: |
      always() &&
      needs.config.outputs.semgrep_enabled == 'true' &&
      (needs.compile.result == 'success' || needs.compile.result == 'skipped')
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dropstat-org/gha-actions-core-lib@main
        with:
          stage: semgrep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarqube:
    name: SonarQube
    needs: [config, compile]
    if: |
      always() &&
      needs.config.outputs.sonarqube_enabled == 'true' &&
      (needs.compile.result == 'success' || needs.compile.result == 'skipped')
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
      # Compiled classes from the compile job (sonar.java.binaries). Absent for
      # non-JVM repos → continue.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: compile-output
      - uses: dropstat-org/gha-actions-core-lib@main
        with:
          stage: sonarqube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # SONAR_HOST_URL is published as an org VARIABLE (non-secret URL) by
          # github-org; fall back to a secret if some repo sets it that way.
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || secrets.SONAR_HOST_URL }}

  trivy:
    name: Trivy
    needs: [config, compile]
    if: |
      always() &&
      needs.config.outputs.trivy_enabled == 'true' &&
      (needs.compile.result == 'success' || needs.compile.result == 'skipped')
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dropstat-org/gha-actions-core-lib@main
        with:
          stage: trivy

  checkov:
    name: Checkov
    needs: config
    if: needs.config.outputs.checkov_enabled == 'true'
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dropstat-org/gha-actions-core-lib@main
        with:
          stage: checkov

  publish:
    name: Publish
    needs: [config, compile, unit_test, linter, semgrep, trivy]
    if: |
      always() &&
      needs.config.outputs.publish_enabled == 'true' &&
      (needs.compile.result == 'success' || needs.compile.result == 'skipped') &&
      needs.unit_test.result != 'failure' &&
      needs.linter.result != 'failure' &&
      needs.semgrep.result != 'failure' &&
      needs.trivy.result != 'failure'
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    permissions:
      # write: PublishStage.tagBuiltCommit() pushes a built/sha-<shortsha> tag so
      # CD promotion stages can resolve the built commit through chained merges
      # (see ImageSHA.ts). read-only here silently 403s that push (swallowed by
      # ignoreReturnCode — see PublishStage fix) and CD falls back to a broken
      # single-hop parent walk.
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4.2.2
      # Reuse the jar/classes already built by the compile job so Dockerfiles
      # can COPY it in directly instead of re-running the full build inside
      # the Docker build stage. continue-on-error: non-JVM repos have no
      # artifact and just build their Dockerfile as before.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: compile-output
      - name: Setup AWS credentials (ECR push)
        uses: dropstat-org/gha-actions-core-lib/.github/actions/setup-terraform@main
        with:
          aws-role-arn: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          session-name: GitHubActions-ci-publish
          terraform-version: ${{ needs.config.outputs.tools_terraform }}
          terragrunt-version: ${{ needs.config.outputs.tools_terragrunt }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      - uses: dropstat-org/gha-actions-core-lib@main
        with:
          stage: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID || vars.AWS_ACCOUNT_ID }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_IMAGE_ORG: ${{ vars.ECR_IMAGE_ORG }}
          AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-2' }}

  generic:
    name: Generic
    needs: config
    if: needs.config.outputs.generic_enabled == 'true'
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dropstat-org/gha-actions-core-lib@main
        with:
          stage: generic

  # ── Terraform CI stages (plan + security, NO deploy) ─────────────────────────

  plan:
    name: Plan
    needs: config
    if: needs.config.outputs.plan_enabled == 'true'
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dropstat-org/gha-actions-core-lib/.github/actions/setup-terraform@main
        with:
          aws-role-arn: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          session-name: GitHubActions-ci-plan
          terraform-version: ${{ needs.config.outputs.tools_terraform }}
          terragrunt-version: ${{ needs.config.outputs.tools_terragrunt }}
      - uses: dropstat-org/gha-actions-core-lib@main
        with:
          stage: plan
        env:
          # GitHub provider token for terraform repos that manage GitHub resources
          # (e.g. github-org). Admin token when present, else the default token
          # (harmless for AWS-only terraform repos).
          GITHUB_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          # Age private key for SopsLoader to decrypt *.secrets.yaml files at the
          # repo root (e.g. github-org sources TF_VAR_sonar_token from SOPS).
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  checkov_tf:
    name: Checkov Terraform
    needs: [config, plan]
    if: |
      always() &&
      needs.config.outputs.checkov_tf_enabled == 'true' &&
      needs.plan.result != 'failure'
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dropstat-org/gha-actions-core-lib@main
        with:
          stage: checkov_tf

  # ── Trigger CD on feature/hotfix/develop pushes ───────────────────────────────
  # NOT done via `workflow_run` in the caller's pipeline-cd.yml: GitHub evaluates a
  # job's `environment:` branch-protection gate against the *run's own* ref, which
  # for workflow_run-triggered runs is always the default branch — never the real
  # head_branch of the CI run that completed. That made ecs_deploy/s3_deploy fail
  # with "Branch 'main' is not allowed to deploy to dev" even though the env's
  # policy explicitly allows feature/*. workflow_dispatch sets github.ref to the
  # ref we pass below, so the environment gate sees the real branch and passes.
  # Caller's pipeline-ci.yml must grant `permissions: actions: write` for this job.
  trigger_cd:
    name: Trigger CD
    needs: [config, compile, unit_test, linter, semgrep, sonarqube, trivy, checkov, publish, generic]
    # The target is 'cancelled', not 'skipped'. `!= 'failure'` let a CANCELLED run
    # dispatch a CD for a build that was never produced, and the CD then deployed
    # whatever built last under the new sha's name. But a bare `== 'success'` is too
    # tight: on develop, compile/publish are legitimately 'skipped' because develop
    # promotes rather than rebuilds (build-once), so requiring success there kills the
    # develop -> dev deploy entirely. `(success || skipped)` excludes 'cancelled' while
    # keeping every legitimate skip - which is why the other jobs already use it.
    if: |
      always() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/hotfix/')) &&
      (needs.compile.result  == 'success' || needs.compile.result == 'skipped') &&
      (needs.publish.result  == 'success' || needs.publish.result == 'skipped') &&
      needs.unit_test.result != 'failure' &&
      needs.linter.result    != 'failure' && needs.semgrep.result  != 'failure' &&
      needs.sonarqube.result != 'failure' && needs.trivy.result    != 'failure' &&
      needs.checkov.result   != 'failure' &&
      needs.generic.result   != 'failure'
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 5
    # No `permissions:` block on purpose - this job inherits whatever the caller
    # granted. A reusable workflow can NARROW the caller's permissions but never
    # expand them, so pinning `actions: write` here silently stripped the
    # `pull-requests: read` the callers do grant, and the PR lookup below died with
    # "Resource not accessible by integration". Naming the scope explicitly is not
    # the fix either: a caller that has not granted it fails with startup_failure -
    # in every repo at once, since they all consume this file at @main. Inheriting
    # works for both. Callers that want the develop handoff must grant
    # `pull-requests: read`; the step below says so by name when it is missing.
    steps:
      # Which CI run holds the artifact the CD must deploy?
      #
      #   feature/hotfix -> this run compiled it, so it is this run.
      #   develop        -> compile is SKIPPED here (build-once: develop promotes,
      #                     it does not rebuild), so the artifact belongs to the CI
      #                     run of the feature branch that was merged in.
      #
      # With a squash merge the develop commit has a single parent, so the feature
      # tip is not reachable through git at all - it has to come from the PR the
      # commit closed. Until now nothing resolved this: the CD was left to auto-pick
      # "the most recent successful build anywhere", which happened to be the right
      # one often enough to look like it worked. That is the whole bug class we are
      # closing, so an unresolved handoff FAILS here rather than dispatching a CD
      # that would go on to guess.
      # Implemented with github-script, not `gh`/`jq`: the self-hosted runners have
      # neither on PATH, and the first version of this step died with
      # "gh: command not found" while reporting it as a permissions problem. Node and
      # the toolkit ship with the action itself, so this depends on nothing local.
      - name: Resolve the CI run that built this commit
        id: build
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;

            if ('${{ needs.compile.result }}' === 'success') {
              core.setOutput('run_id', String(context.runId));
              core.info(`This run compiled the artifact - pinning the CD to ${context.runId}.`);
              return;
            }

            // The PR whose merge produced this commit. Works for squash (single parent,
            // no git link to the feature tip) and for merge commits alike.
            let pulls;
            try {
              ({data: pulls} = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: context.sha,
              }));
            } catch (err) {
              // Only a 403 means "scope missing" - report that, and only that. The
              // previous version blamed permissions for every failure, which sent one
              // diagnosis down the wrong path for an hour.
              if (err.status === 403) {
                core.setFailed(
                  `Cannot resolve which build to deploy: reading the pull requests for ${context.sha} ` +
                  `was refused. Add 'pull-requests: read' to the permissions block of the job that ` +
                  `calls this workflow. Meanwhile, deploy manually with an explicit run_id.`);
                return;
              }
              throw err;
            }
            const merged = pulls.filter(p => p.merged_at)
                                .sort((a, b) => new Date(a.merged_at) - new Date(b.merged_at));
            const buildSha = merged.at(-1)?.head?.sha;
            if (!buildSha) {
              core.setFailed(
                `Cannot resolve which build to deploy: ${context.sha} did not compile here and is ` +
                `not associated with any merged pull request, so the commit that built the artifact ` +
                `is unknown. Deploy manually with an explicit run_id.`);
              return;
            }
            core.info(`Commit ${context.sha} came from PR head ${buildSha}.`);

            // Its successful Pipeline CI runs, newest first. The run must still HOLD
            // artifacts - they expire, and an empty run is not a usable handoff.
            const {data: runs} = await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, head_sha: buildSha, status: 'success', per_page: 50,
            });
            // Match on the workflow FILE, never on `r.name`: callers set `run-name`, so a
            // CI run is called "CI feature/x - sha-abc - @someone", not "Pipeline CI".
            // Filtering by name silently found nothing and reported it as "no build
            // exists" for a build that was sitting right there with a live artifact.
            const ciRuns = runs.workflow_runs
              .filter(r => r.path.endsWith('/pipeline-ci.yml'))
              .sort((a, b) => new Date(b.run_started_at) - new Date(a.run_started_at));

            for (const run of ciRuns) {
              const {data: arts} = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: run.id,
              });
              if (arts.artifacts.some(a => !a.expired)) {
                core.setOutput('run_id', String(run.id));
                core.info(`Pinning the CD to CI run ${run.id}.`);
                return;
              }
              core.info(`CI run ${run.id} has no live artifacts - trying the next one.`);
            }

            core.setFailed(
              `Cannot resolve which build to deploy: no successful 'pipeline-ci.yml' run with live ` +
              `artifacts exists for ${buildSha} (the commit merged into ${context.ref}). Its CI ` +
              `never ran, failed, or its artifacts expired. Re-run CI on that commit, or deploy ` +
              `manually with an explicit run_id.`);

      # sha_tag stays the commit being DEPLOYED (what the CD run-name announces and
      # what people look for); run_id names the build it actually ships. On develop
      # those two are different commits by design, and that is exactly the fact the
      # old pipeline threw away.
      - name: Dispatch Pipeline CD for ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pipeline-cd.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"sha_tag\":\"sha-${{ github.sha }}\",\"run_id\":\"${{ steps.build.outputs.run_id }}\",\"environment\":\"dev\"}}"
