name: ActionsCoreLib

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      sha_tag:
        description: "Override image SHA tag for CD repos (e.g. sha-abc1234). If not set, uses the commit SHA."
        type: string
        required: false
        default: ""
      runner:
        description: "Runner label(s) — defaults to ubuntu-latest. Pass a JSON array string for self-hosted (e.g. '[\"self-hosted\",\"aws\",\"dropstat\"]')."
        type: string
        required: false
        default: '["self-hosted","aws","dropstat"]'

# Every job resolves its runner as `inputs.runner || '["ubuntu-latest"]'`.
#
# The `||` fallback ONLY applies when there are no inputs at all - that is, when
# this file runs as this repo's own CI (push / pull_request / workflow_dispatch).
# Callers always go through `workflow_call`, where the declared default above
# gives them the self-hosted labels exactly as before; nothing changes for them.
#
# The fallback must NOT be self-hosted, because this repo is PUBLIC and the org's
# "Default" runner group has allows_public_repositories = false. GitHub therefore
# never assigns a self-hosted runner to a job here: the job sits queued until the
# queue timeout expires and the run is marked `cancelled`. Every run of this
# workflow since it was created died that way, without ever executing a step.
#
# Enabling public repos on the runner group is the other way to fix it, and it is
# the wrong one: it would let a pull request from any fork of this public repo run
# arbitrary code on the self-hosted runners inside the VPC.

jobs:
  config:
    name: Config
    runs-on: ${{ fromJSON(inputs.runner || '["ubuntu-latest"]') }}
    outputs:
      compile_enabled:     ${{ steps.ActionsCoreLib.outputs.compile_enabled }}
      unit_test_enabled:   ${{ steps.ActionsCoreLib.outputs.unit_test_enabled }}
      linter_enabled:      ${{ steps.ActionsCoreLib.outputs.linter_enabled }}
      semgrep_enabled:     ${{ steps.ActionsCoreLib.outputs.semgrep_enabled }}
      sonarqube_enabled:   ${{ steps.ActionsCoreLib.outputs.sonarqube_enabled }}
      trivy_enabled:       ${{ steps.ActionsCoreLib.outputs.trivy_enabled }}
      checkov_enabled:     ${{ steps.ActionsCoreLib.outputs.checkov_enabled }}
      checkov_tf_enabled:  ${{ steps.ActionsCoreLib.outputs.checkov_tf_enabled }}
      plan_enabled:        ${{ steps.ActionsCoreLib.outputs.plan_enabled }}
      publish_enabled:     ${{ steps.ActionsCoreLib.outputs.publish_enabled }}
      release_enabled:     ${{ steps.ActionsCoreLib.outputs.release_enabled }}
      ecs_deploy_enabled:  ${{ steps.ActionsCoreLib.outputs.ecs_deploy_enabled }}
      deploy_enabled:      ${{ steps.ActionsCoreLib.outputs.deploy_enabled }}
      pre_deploy_enabled:  ${{ steps.ActionsCoreLib.outputs.pre_deploy_enabled }}
      post_deploy_enabled: ${{ steps.ActionsCoreLib.outputs.post_deploy_enabled }}
      generic_enabled:     ${{ steps.ActionsCoreLib.outputs.generic_enabled }}
      deploy_environment:  ${{ steps.ActionsCoreLib.outputs.deploy_environment }}
      tools_java:          ${{ steps.ActionsCoreLib.outputs.tools_java }}
      tools_maven:         ${{ steps.ActionsCoreLib.outputs.tools_maven }}
      tools_node:          ${{ steps.ActionsCoreLib.outputs.tools_node }}
      tools_terraform:     ${{ steps.ActionsCoreLib.outputs.tools_terraform }}
      tools_terragrunt:    ${{ steps.ActionsCoreLib.outputs.tools_terragrunt }}
      ActionsCoreLib_type: ${{ steps.ActionsCoreLib.outputs.ActionsCoreLib_type }}
    steps:
      - uses: actions/checkout@v4.2.2
      - id: ActionsCoreLib
        uses: dropstat-org/gha-actions-core-lib@feature/sonar-mirror-key
        with:
          stage: config

  # ── App / Library stages ────────────────────────────────────────────────────

  compile:
    name: Compile
    needs: config
    if: needs.config.outputs.compile_enabled == 'true'
    runs-on: ${{ fromJSON(inputs.runner || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Setup Java
        if: needs.config.outputs.tools_java != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ needs.config.outputs.tools_java }}
      - name: Setup Maven
        if: needs.config.outputs.tools_maven != ''
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: ${{ needs.config.outputs.tools_maven }}
      - uses: dropstat-org/gha-actions-core-lib@feature/sonar-mirror-key
        with:
          stage: compile

  unit_test:
    name: Unit Test
    needs: [config, compile]
    if: |
      always() &&
      needs.config.outputs.unit_test_enabled == 'true' &&
      (needs.compile.result == 'success' || needs.compile.result == 'skipped')
    runs-on: ${{ fromJSON(inputs.runner || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dropstat-org/gha-actions-core-lib@feature/sonar-mirror-key
        with:
          stage: unit_test

  linter:
    name: Linter
    needs: [config, compile]
    if: |
      always() &&
      needs.config.outputs.linter_enabled == 'true' &&
      (needs.compile.result == 'success' || needs.compile.result == 'skipped')
    runs-on: ${{ fromJSON(inputs.runner || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dropstat-org/gha-actions-core-lib@feature/sonar-mirror-key
        with:
          stage: linter

  semgrep:
    name: Semgrep
    needs: [config, compile]
    if: |
      always() &&
      needs.config.outputs.semgrep_enabled == 'true' &&
      (needs.compile.result == 'success' || needs.compile.result == 'skipped')
    runs-on: ${{ fromJSON(inputs.runner || '["ubuntu-latest"]') }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dropstat-org/gha-actions-core-lib@feature/sonar-mirror-key
        with:
          stage: semgrep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarqube:
    name: SonarQube
    needs: [config, compile]
    if: |
      always() &&
      needs.config.outputs.sonarqube_enabled == 'true' &&
      (needs.compile.result == 'success' || needs.compile.result == 'skipped')
    runs-on: ${{ fromJSON(inputs.runner || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dropstat-org/gha-actions-core-lib@feature/sonar-mirror-key
        with:
          stage: sonarqube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  trivy:
    name: Trivy
    needs: [config, compile]
    if: |
      always() &&
      needs.config.outputs.trivy_enabled == 'true' &&
      (needs.compile.result == 'success' || needs.compile.result == 'skipped')
    runs-on: ${{ fromJSON(inputs.runner || '["ubuntu-latest"]') }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dropstat-org/gha-actions-core-lib@feature/sonar-mirror-key
        with:
          stage: trivy

  checkov:
    name: Checkov
    needs: config
    if: needs.config.outputs.checkov_enabled == 'true'
    runs-on: ${{ fromJSON(inputs.runner || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dropstat-org/gha-actions-core-lib@feature/sonar-mirror-key
        with:
          stage: checkov

  publish:
    name: Publish
    needs: [config, compile, unit_test, linter, semgrep, trivy]
    if: |
      always() &&
      needs.config.outputs.publish_enabled == 'true' &&
      (needs.compile.result == 'success' || needs.compile.result == 'skipped') &&
      needs.unit_test.result != 'failure' &&
      needs.linter.result != 'failure' &&
      needs.semgrep.result != 'failure' &&
      needs.trivy.result != 'failure'
    runs-on: ${{ fromJSON(inputs.runner || '["ubuntu-latest"]') }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Setup AWS credentials (ECR push)
        uses: dropstat-org/gha-actions-core-lib/.github/actions/setup-terraform@main
        with:
          aws-role-arn: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          session-name: GitHubActions-publish
          terraform-version: ${{ needs.config.outputs.tools_terraform }}
          terragrunt-version: ${{ needs.config.outputs.tools_terragrunt }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      - uses: dropstat-org/gha-actions-core-lib@feature/sonar-mirror-key
        with:
          stage: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID || vars.AWS_ACCOUNT_ID }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_IMAGE_ORG: ${{ vars.ECR_IMAGE_ORG }}
          AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-2' }}

  pre_deploy:
    name: Pre Deploy
    needs: [config, publish]
    if: |
      always() &&
      needs.config.outputs.pre_deploy_enabled == 'true' &&
      needs.publish.result != 'failure'
    runs-on: ${{ fromJSON(inputs.runner || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dropstat-org/gha-actions-core-lib@feature/sonar-mirror-key
        with:
          stage: pre_deploy

  generic:
    name: Generic
    needs: config
    if: needs.config.outputs.generic_enabled == 'true'
    runs-on: ${{ fromJSON(inputs.runner || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dropstat-org/gha-actions-core-lib@feature/sonar-mirror-key
        with:
          stage: generic

  # ── Terraform stages ────────────────────────────────────────────────────────

  plan:
    name: Plan
    needs: config
    if: needs.config.outputs.plan_enabled == 'true'
    runs-on: ${{ fromJSON(inputs.runner || '["ubuntu-latest"]') }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dropstat-org/gha-actions-core-lib/.github/actions/setup-terraform@main
        with:
          aws-role-arn: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          session-name: GitHubActions-plan
          terraform-version: ${{ needs.config.outputs.tools_terraform }}
          terragrunt-version: ${{ needs.config.outputs.tools_terragrunt }}
      - uses: dropstat-org/gha-actions-core-lib@feature/sonar-mirror-key
        with:
          stage: plan
        env:
          # GitHub provider token for terraform repos that manage GitHub resources
          # (e.g. github-org). Admin token when present, else the default token
          # (harmless for AWS-only terraform repos).
          GITHUB_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          # Age private key for SopsLoader to decrypt *.secrets.yaml files.
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  checkov_tf:
    name: Checkov Terraform
    needs: [config, plan]
    if: |
      always() &&
      needs.config.outputs.checkov_tf_enabled == 'true' &&
      needs.plan.result != 'failure'
    runs-on: ${{ fromJSON(inputs.runner || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dropstat-org/gha-actions-core-lib@feature/sonar-mirror-key
        with:
          stage: checkov_tf

  # ── Deploy (shared: app + terraform) ────────────────────────────────────────

  deploy:
    name: Deploy
    needs: [config, pre_deploy, plan]
    # environment gate: uses deploy.environment from action.yaml (empty = no gate for app repos)
    # When the environment has required reviewers, GitHub pauses here until approved/rejected.
    # timeout-minutes aborts automatically if nobody acts within the window.
    environment: ${{ needs.config.outputs.deploy_environment }}
    timeout-minutes: 60
    if: |
      always() &&
      needs.config.outputs.deploy_enabled == 'true' &&
      needs.pre_deploy.result != 'failure' &&
      (needs.plan.result == 'success' || needs.plan.result == 'skipped')
    runs-on: ${{ fromJSON(inputs.runner || '["ubuntu-latest"]') }}
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.2.2
      # Solo para repos terraform — app repos no tienen AWS_ROLE_ARN ni necesitan OIDC aquí
      - name: Setup Terraform + AWS
        if: needs.config.outputs.plan_enabled == 'true'
        uses: dropstat-org/gha-actions-core-lib/.github/actions/setup-terraform@main
        with:
          aws-role-arn: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          session-name: GitHubActions-deploy
          terraform-version: ${{ needs.config.outputs.tools_terraform }}
          terragrunt-version: ${{ needs.config.outputs.tools_terragrunt }}
      - uses: dropstat-org/gha-actions-core-lib@feature/sonar-mirror-key
        with:
          stage: deploy
        env:
          # GitHub provider token for terraform repos that manage GitHub resources
          # (e.g. github-org). Admin token when present, else the default token.
          GITHUB_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID || vars.AWS_ACCOUNT_ID }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_IMAGE_ORG: ${{ vars.ECR_IMAGE_ORG }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          # Age private key for SopsLoader to decrypt *.secrets.yaml files.
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  post_deploy:
    name: Post Deploy
    needs: [config, deploy]
    if: |
      always() &&
      needs.config.outputs.post_deploy_enabled == 'true' &&
      needs.deploy.result != 'failure'
    runs-on: ${{ fromJSON(inputs.runner || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dropstat-org/gha-actions-core-lib@feature/sonar-mirror-key
        with:
          stage: post_deploy

  release:
    name: Release
    needs: [config, deploy]
    if: |
      always() &&
      needs.config.outputs.release_enabled == 'true' &&
      needs.deploy.result != 'failure'
    runs-on: ${{ fromJSON(inputs.runner || '["ubuntu-latest"]') }}
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Setup AWS credentials
        uses: dropstat-org/gha-actions-core-lib/.github/actions/setup-terraform@main
        with:
          aws-role-arn: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          session-name: GitHubActions-release
          terraform-version: ${{ needs.config.outputs.tools_terraform }}
          terragrunt-version: ${{ needs.config.outputs.tools_terragrunt }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      - uses: dropstat-org/gha-actions-core-lib@feature/sonar-mirror-key
        with:
          stage: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA_TAG: ${{ inputs.sha_tag }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID || vars.AWS_ACCOUNT_ID }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_IMAGE_ORG: ${{ vars.ECR_IMAGE_ORG }}

  ecs_deploy:
    name: ECS Deploy
    needs: [config, release]
    if: |
      always() &&
      needs.config.outputs.ecs_deploy_enabled == 'true' &&
      needs.release.result != 'failure'
    runs-on: ${{ fromJSON(inputs.runner || '["ubuntu-latest"]') }}
    # Environment gate — injects ECS_DEPLOY_ROLE secret for the target env (dev/qa/prod)
    environment: ${{ needs.config.outputs.deploy_environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Setup AWS credentials
        uses: dropstat-org/gha-actions-core-lib/.github/actions/setup-terraform@main
        with:
          aws-role-arn: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          session-name: GitHubActions-ecs-deploy
          terraform-version: ${{ needs.config.outputs.tools_terraform }}
          terragrunt-version: ${{ needs.config.outputs.tools_terragrunt }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      - uses: dropstat-org/gha-actions-core-lib@feature/sonar-mirror-key
        with:
          stage: ecs_deploy
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID || vars.AWS_ACCOUNT_ID }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_IMAGE_ORG: ${{ vars.ECR_IMAGE_ORG }}
          ECS_DEPLOY_ROLE: ${{ secrets.ECS_DEPLOY_ROLE }}
          SHA_TAG: ${{ inputs.sha_tag }}
