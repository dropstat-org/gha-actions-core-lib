name: Pipeline CD

# Reusable CD half of the pipeline.
#   app       → release (promote sha → env tag) + ecs_deploy
#   terraform → plan + checkov_tf + deploy (+ release tag on master)
#
# The library's config stage runs with PIPELINE_PHASE=cd, which intersects the
# branch-allowed stages with the CD set and derives deploy_environment from the
# branch (develop→dev, release/*→qa, master/main→prod). The GitHub `environment:`
# gate provides the approval step + scoped ECS_DEPLOY_ROLE var per environment.
#
# Image promotion rules (unchanged, enforced by AppRelease / ECSDeployStage):
#   develop→:dev  release/*→:qa  master/main→:prod (prod only from master/main).

on:
  workflow_call:
    inputs:
      sha_tag:
        description: "Image sha tag to promote/deploy (e.g. sha-abc1234). Empty = commit sha / env name."
        type: string
        required: false
        default: ""
      deploy_ref:
        description: "Branch being deployed (e.g. feature/x, develop). Required when triggered by workflow_run/dispatch so env routing is correct. Empty = GITHUB_REF."
        type: string
        required: false
        default: ""
      run_id:
        description: "Frontend (S3) only: CI run id to pull the dist artifact from (rollback/redeploy a specific build). Empty = latest successful CI run."
        type: string
        required: false
        default: ""
      deploy_environment:
        description: "Manual dispatch only: target env (dev/qa/uat/prod) to override branch-derived routing. Empty = route by branch. The GitHub environment gate stays the security boundary."
        type: string
        required: false
        default: ""
      branching_strategy:
        type: string
        required: false
        default: ""
      force_build:
        description: "Same opt-in signal as pipeline-ci.yml's force_build: the image being deployed was compiled+published directly on release/** (no :qa tag by design), so ECSDeployStage's qa-promotion gate should not block it. Default false preserves the gate for every other repo/branch."
        type: boolean
        required: false
        default: false
      runner:
        description: "Runner label(s) — defaults to ubuntu-latest. Pass a JSON array string for self-hosted (e.g. '[\"self-hosted\",\"aws\",\"dropstat\"]')."
        type: string
        required: false
        default: '["self-hosted","aws","dropstat"]'
  workflow_dispatch:
    inputs:
      sha_tag:
        description: "Image tag to deploy (e.g. sha-cdb6761)"
        required: false
        type: string
        default: ""
      environment:
        description: "Target environment"
        type: choice
        options: [dev, qa]    # prod only via master/main
        default: dev
      run_id:
        description: "Frontend (S3) only: CI run id to deploy (rollback). Empty = latest."
        required: false
        type: string
        default: ""

# PIPELINE_REF makes branch detection use the real deploy branch instead of
# GITHUB_REF (which points at the default branch under workflow_run). Set per job
# (workflow-level env cannot reference the inputs context in a reusable workflow).

jobs:
  config:
    name: Config
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    env:
      PIPELINE_PHASE: cd
      PIPELINE_REF: ${{ inputs.deploy_ref }}
      BRANCHING_STRATEGY: ${{ inputs.branching_strategy }}
      # Manual dispatch only: pick the target env directly (honored by the lib
      # OutputWriter when GITHUB_EVENT_NAME == workflow_dispatch). Empty on
      # push/workflow_run → branch derivation. Covers workflow_call (deploy_environment)
      # and the reusable's own dispatch (environment).
      DEPLOY_ENVIRONMENT_OVERRIDE: ${{ inputs.deploy_environment || inputs.environment }}
    outputs:
      plan_enabled:        ${{ steps.cfg.outputs.plan_enabled }}
      checkov_tf_enabled:  ${{ steps.cfg.outputs.checkov_tf_enabled }}
      pre_deploy_enabled:  ${{ steps.cfg.outputs.pre_deploy_enabled }}
      deploy_enabled:      ${{ steps.cfg.outputs.deploy_enabled }}
      post_deploy_enabled: ${{ steps.cfg.outputs.post_deploy_enabled }}
      release_enabled:     ${{ steps.cfg.outputs.release_enabled }}
      ecs_deploy_enabled:  ${{ steps.cfg.outputs.ecs_deploy_enabled }}
      s3_deploy_enabled:   ${{ steps.cfg.outputs.s3_deploy_enabled }}
      deploy_environment:  ${{ steps.cfg.outputs.deploy_environment }}
      tools_terraform:     ${{ steps.cfg.outputs.tools_terraform }}
      tools_terragrunt:    ${{ steps.cfg.outputs.tools_terragrunt }}
      ActionsCoreLib_type: ${{ steps.cfg.outputs.ActionsCoreLib_type }}
      resolved_ref:        ${{ steps.resolve_ref.outputs.ref || inputs.deploy_ref }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.deploy_ref }}
          # depth 2 exposes a merge commit's parents so the library can resolve the
          # image sha from the merged feature tip (resolveImageSHA -> 2nd parent).
          # depth 1 grafts HEAD as a root and hides parents -> wrong sha (merge commit).
          fetch-depth: 0
      # A hotfix/* PR merged to main produces a push event indistinguishable from a
      # release/* merge (both land as ref=main) — BranchDetector would misclassify
      # a hotfix as MASTER and run onMaster() (promote from :uat) instead of
      # onHotfix() (build its own image, skip uat). Only main is ambiguous this way;
      # develop/release/** pushes already carry their own real branch name. Look up
      # the PR associated with this merge commit and override PIPELINE_REF only when
      # its head branch is hotfix/* — release merges to main must keep resolving to
      # MASTER, that's the correct final-promotion behavior.
      - name: Resolve hotfix source branch
        id: resolve_ref
        if: github.event_name == 'push' && (inputs.deploy_ref == 'main' || inputs.deploy_ref == 'master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_REF=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            | jq -r '.[0].head.ref // empty')
          if [[ "$HEAD_REF" == hotfix/* ]]; then
            echo "Merge source is $HEAD_REF — overriding PIPELINE_REF (was ${{ inputs.deploy_ref }}) so onHotfix() runs"
            echo "PIPELINE_REF=$HEAD_REF" >> "$GITHUB_ENV"
            echo "ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ inputs.deploy_ref }}" >> "$GITHUB_OUTPUT"
          fi
      - id: cfg
        uses: dropstat-org/gha-actions-core-lib@main
        with:
          stage: config

  # ── Terraform CD: plan (artifact) + security gate before deploy ──────────────

  plan:
    name: Plan
    needs: config
    if: needs.config.outputs.plan_enabled == 'true'
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.deploy_ref }}
          # depth 2 exposes a merge commit's parents so the library can resolve the
          # image sha from the merged feature tip (resolveImageSHA -> 2nd parent).
          # depth 1 grafts HEAD as a root and hides parents -> wrong sha (merge commit).
          fetch-depth: 0
      - uses: dropstat-org/gha-actions-core-lib/.github/actions/setup-terraform@main
        with:
          aws-role-arn: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          session-name: GitHubActions-cd-plan
          terraform-version: ${{ needs.config.outputs.tools_terraform }}
          terragrunt-version: ${{ needs.config.outputs.tools_terragrunt }}
      - uses: dropstat-org/gha-actions-core-lib@main
        with:
          stage: plan

  checkov_tf:
    name: Checkov Terraform
    needs: [config, plan]
    if: |
      always() &&
      needs.config.outputs.checkov_tf_enabled == 'true' &&
      needs.plan.result != 'failure'
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.deploy_ref }}
          # depth 2 exposes a merge commit's parents so the library can resolve the
          # image sha from the merged feature tip (resolveImageSHA -> 2nd parent).
          # depth 1 grafts HEAD as a root and hides parents -> wrong sha (merge commit).
          fetch-depth: 0
      - uses: dropstat-org/gha-actions-core-lib@main
        with:
          stage: checkov_tf

  pre_deploy:
    name: Pre Deploy
    needs: [config, plan]
    if: |
      always() &&
      needs.config.outputs.pre_deploy_enabled == 'true' &&
      needs.plan.result != 'failure'
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.deploy_ref }}
          # depth 2 exposes a merge commit's parents so the library can resolve the
          # image sha from the merged feature tip (resolveImageSHA -> 2nd parent).
          # depth 1 grafts HEAD as a root and hides parents -> wrong sha (merge commit).
          fetch-depth: 0
      - uses: dropstat-org/gha-actions-core-lib@main
        with:
          stage: pre_deploy

  # ── Review gate: TODO apply terraform requiere aprobacion manual (cualquier env) ──
  # required-reviewers en environments no esta disponible en el plan (repos privados),
  # asi que el gate se hace in-workflow. Este job gatea type=terraform (cualquier env);
  # los apps se gatean en approval_app (solo uat/prod).
  # El caller debe conceder issues:write (un reusable no puede exceder permisos del caller).
  # Aprobadores: variable CD_APPROVERS (org/repo).
  approval:
    name: Approval
    # Un run viejo aprobado tarde se aplica DESPUES de uno nuevo y pisa qa con un
    # build anterior -- paso el 2026-08-03: el CD de las 13:30 se aprobo 13:56, ya
    # desplegado el de las 13:48. La compuerta no creo el problema pero abrio la
    # ventana de segundos a media hora. Al entrar un run nuevo al grupo, el viejo
    # que sigue esperando aprobacion se cancela; los jobs de deploy piden
    # result == success || skipped, asi que un cancelled no despliega nada.
    concurrency:
      group: cd-approval-${{ github.repository }}-${{ needs.config.outputs.deploy_environment }}
      cancel-in-progress: true
    needs: [config, plan, pre_deploy]
    if: |
      always() &&
      needs.config.outputs.deploy_enabled == 'true' &&
      needs.config.outputs.ActionsCoreLib_type == 'terraform' &&
      needs.plan.result != 'failure' &&
      needs.pre_deploy.result != 'failure'
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    permissions:
      issues: write
    steps:
      # CD_APPROVERS can list org/team-slug entries (not just usernames) — the
      # default github.token cannot list team members to expand those, so we
      # mint a GitHub App installation token (Members: read-only) instead.
      - name: Generate app token (team-approver expansion)
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CD_APPROVAL_APP_ID }}
          private-key: ${{ secrets.CD_APPROVAL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      # continue-on-error: el paso falla por DOS causas muy distintas -- un humano
      # que escribio "denied", o un 5xx de la API de GitHub. El 2026-08-03 fue lo
      # segundo: el gate creo el issue #5451 y murio en el POST del comentario
      # decorativo (500), matando un deploy ya aprobable. El paso siguiente separa
      # los dos casos ANTES de decidir si se reintenta.
      - name: Manual approval gate
        id: gate
        continue-on-error: true
        uses: trstringer/manual-approval@74d99dff7380e3e4b122d4ededcbca2b6ce59367  # v1.12.0
        with:
          secret: ${{ steps.app-token.outputs.token || github.token }}
          approvers: ${{ vars.CD_APPROVERS }}
          minimum-approvals: 1
          issue-title: "Aprobar deploy terraform: ${{ github.repository }} @ ${{ inputs.deploy_ref || github.ref_name }}"
          issue-body: "Revisa el plan del CI antes de aprobar. Comenta approved para aplicar o denied para cancelar."
          exclude-workflow-initiator-as-approver: false

      - name: Classify the gate failure
        id: verdict
        if: steps.gate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          TITLE: "Aprobar deploy terraform: ${{ github.repository }} @ ${{ inputs.deploy_ref || github.ref_name }}"
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          api() {
            curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                     -H "Accept: application/vnd.github+json" \
                     "https://api.github.com/repos/$REPO/$1"
          }

          # La pregunta no es "cuanto tardo en fallar" -- esa heuristica confunde una
          # denegacion rapida con una caida. La pregunta es si alguien escribio la
          # palabra: se lee el issue que este mismo job acaba de abrir.
          num=$(api "issues?state=all&sort=created&direction=desc&per_page=50" \
                  | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)] | first | .number // empty')

          if [ -z "$num" ]; then
            # Ni siquiera llego a crear el issue: no hubo nada que denegar.
            echo "No se encontro el issue de aprobacion - la falla es anterior a la votacion."
            echo "denied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # gsub sobre [^a-z] en vez de \s: los backslashes no sobreviven la vuelta
          # YAML -> shell -> jq, y de paso esto tolera "Denied." o ":x: denied".
          by=$(api "issues/$num/comments?per_page=100" \
                 | jq -r '[.[] | .body |= (ascii_downcase | gsub("[^a-z]"; ""))
                            | select(.body == "denied" or .body == "deny" or .body == "no")]
                          | last | .user.login // empty')

          if [ -n "$by" ]; then
            echo "Denegado por $by en el issue #$num."
            echo "denied=true"  >> "$GITHUB_OUTPUT"
            echo "by=$by"       >> "$GITHUB_OUTPUT"
          else
            echo "Issue #$num sin denegacion: el gate se cayo solo."
            echo "denied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Human denial - stop here
        if: steps.gate.outcome == 'failure' && steps.verdict.outputs.denied == 'true'
        run: |
          echo "::error::Deploy denegado por ${{ steps.verdict.outputs.by }} en el issue de aprobacion. No se reintenta."
          exit 1

      # Solo se llega aca si NO hubo denegacion: el gate se cayo solo. Se abre un
      # issue nuevo y se vuelve a esperar la aprobacion -- no se da por aprobado nada.
      - name: Manual approval gate (retry)
        if: steps.gate.outcome == 'failure' && steps.verdict.outputs.denied != 'true'
        uses: trstringer/manual-approval@74d99dff7380e3e4b122d4ededcbca2b6ce59367  # v1.12.0
        with:
          secret: ${{ steps.app-token.outputs.token || github.token }}
          approvers: ${{ vars.CD_APPROVERS }}
          minimum-approvals: 1
          issue-title: "Aprobar deploy terraform (reintento): ${{ github.repository }} @ ${{ inputs.deploy_ref || github.ref_name }}"
          issue-body: "El gate anterior se cayo por un error transitorio de la API de GitHub, no por una denegacion. Comenta approved para aplicar o denied para cancelar."
          exclude-workflow-initiator-as-approver: false

  # ── Review gate (app): ECS/S3 deploys a uat/prod requieren aprobacion manual ──
  # Mismo mecanismo issue-approval que terraform. dev NO se gatea (skipped).
  # Aplica cuando el env ruteado (branch u override manual) es qa, uat o prod.
  #
  # qa se sumo tras el incidente del 2026-08-03: qa desplegaba una imagen 20
  # commits atrasada y nadie lo noto en tres dias, porque ningun humano miraba
  # el deploy. El gate no habria resuelto la causa, pero pone un par de ojos
  # sobre el sha que se va a desplegar antes de que llegue al ambiente donde QA
  # certifica.
  approval_app:
    name: Approval (app qa/uat/prod)
    # Un run viejo aprobado tarde se aplica DESPUES de uno nuevo y pisa qa con un
    # build anterior -- paso el 2026-08-03: el CD de las 13:30 se aprobo 13:56, ya
    # desplegado el de las 13:48. La compuerta no creo el problema pero abrio la
    # ventana de segundos a media hora. Al entrar un run nuevo al grupo, el viejo
    # que sigue esperando aprobacion se cancela; los jobs de deploy piden
    # result == success || skipped, asi que un cancelled no despliega nada.
    concurrency:
      group: cd-approval-${{ github.repository }}-${{ needs.config.outputs.deploy_environment }}
      cancel-in-progress: true
    needs: [config]
    if: |
      needs.config.outputs.ActionsCoreLib_type != 'terraform' &&
      (needs.config.outputs.ecs_deploy_enabled == 'true' || needs.config.outputs.s3_deploy_enabled == 'true') &&
      (needs.config.outputs.deploy_environment == 'qa' ||
       needs.config.outputs.deploy_environment == 'uat' ||
       needs.config.outputs.deploy_environment == 'prod')
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    permissions:
      issues: write
    steps:
      - name: Generate app token (team-approver expansion)
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CD_APPROVAL_APP_ID }}
          private-key: ${{ secrets.CD_APPROVAL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      # Ver el comentario del gate de terraform: continue-on-error + clasificacion
      # explicita, porque el paso falla igual por una denegacion humana que por un
      # 5xx de la API, y reintentar a ciegas reabriria una compuerta ya cerrada.
      - name: Manual approval gate
        id: gate
        continue-on-error: true
        uses: trstringer/manual-approval@74d99dff7380e3e4b122d4ededcbca2b6ce59367  # v1.12.0
        with:
          secret: ${{ steps.app-token.outputs.token || github.token }}
          approvers: ${{ vars.CD_APPROVERS }}
          minimum-approvals: 1
          issue-title: "Aprobar deploy app (${{ needs.config.outputs.deploy_environment }}): ${{ github.repository }} @ ${{ inputs.deploy_ref || github.ref_name }}"
          issue-body: "Deploy ECS/S3 a ${{ needs.config.outputs.deploy_environment }}. Comenta approved para desplegar o denied para cancelar."
          exclude-workflow-initiator-as-approver: false

      - name: Classify the gate failure
        id: verdict
        if: steps.gate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          TITLE: "Aprobar deploy app (${{ needs.config.outputs.deploy_environment }}): ${{ github.repository }} @ ${{ inputs.deploy_ref || github.ref_name }}"
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          api() {
            curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                     -H "Accept: application/vnd.github+json" \
                     "https://api.github.com/repos/$REPO/$1"
          }

          # La pregunta no es "cuanto tardo en fallar" -- esa heuristica confunde una
          # denegacion rapida con una caida. La pregunta es si alguien escribio la
          # palabra: se lee el issue que este mismo job acaba de abrir.
          num=$(api "issues?state=all&sort=created&direction=desc&per_page=50" \
                  | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)] | first | .number // empty')

          if [ -z "$num" ]; then
            # Ni siquiera llego a crear el issue: no hubo nada que denegar.
            echo "No se encontro el issue de aprobacion - la falla es anterior a la votacion."
            echo "denied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # gsub sobre [^a-z] en vez de \s: los backslashes no sobreviven la vuelta
          # YAML -> shell -> jq, y de paso esto tolera "Denied." o ":x: denied".
          by=$(api "issues/$num/comments?per_page=100" \
                 | jq -r '[.[] | .body |= (ascii_downcase | gsub("[^a-z]"; ""))
                            | select(.body == "denied" or .body == "deny" or .body == "no")]
                          | last | .user.login // empty')

          if [ -n "$by" ]; then
            echo "Denegado por $by en el issue #$num."
            echo "denied=true"  >> "$GITHUB_OUTPUT"
            echo "by=$by"       >> "$GITHUB_OUTPUT"
          else
            echo "Issue #$num sin denegacion: el gate se cayo solo."
            echo "denied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Human denial - stop here
        if: steps.gate.outcome == 'failure' && steps.verdict.outputs.denied == 'true'
        run: |
          echo "::error::Deploy denegado por ${{ steps.verdict.outputs.by }} en el issue de aprobacion. No se reintenta."
          exit 1

      - name: Manual approval gate (retry)
        if: steps.gate.outcome == 'failure' && steps.verdict.outputs.denied != 'true'
        uses: trstringer/manual-approval@74d99dff7380e3e4b122d4ededcbca2b6ce59367  # v1.12.0
        with:
          secret: ${{ steps.app-token.outputs.token || github.token }}
          approvers: ${{ vars.CD_APPROVERS }}
          minimum-approvals: 1
          issue-title: "Aprobar deploy app (${{ needs.config.outputs.deploy_environment }}) - reintento: ${{ github.repository }} @ ${{ inputs.deploy_ref || github.ref_name }}"
          issue-body: "El gate anterior se cayo por un error transitorio de la API de GitHub, no por una denegacion. Comenta approved para desplegar o denied para cancelar."
          exclude-workflow-initiator-as-approver: false

  # ── Deploy (terraform apply) ─────────────────────────────────────────────────

  deploy:
    name: Deploy
    # Sin cancel: dos applies al mismo ambiente se serializan, no se descartan.
    concurrency:
      group: cd-deploy-${{ github.repository }}-${{ needs.config.outputs.deploy_environment }}
    needs: [config, plan, pre_deploy, approval]
    environment: ${{ needs.config.outputs.deploy_environment }}
    timeout-minutes: 60
    if: |
      always() &&
      needs.config.outputs.deploy_enabled == 'true' &&
      needs.pre_deploy.result != 'failure' &&
      (needs.plan.result == 'success' || needs.plan.result == 'skipped') &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    runs-on: ${{ fromJSON(inputs.runner) }}
    permissions:
      id-token: write
      contents: read
      packages: write
      actions: read   # app deploys (static frontends) descargan el artifact dist via 'gh run download'
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.deploy_ref }}
          # depth 2 exposes a merge commit's parents so the library can resolve the
          # image sha from the merged feature tip (resolveImageSHA -> 2nd parent).
          # depth 1 grafts HEAD as a root and hides parents -> wrong sha (merge commit).
          fetch-depth: 0
      # Always assume AWS_ROLE_ARN: terraform deploys AND app deploys (e.g. static
      # frontends doing `aws s3 sync` + CloudFront invalidation) both need creds.
      # setup-terraform also installs TF/TG (harmless for app deploys).
      - name: Setup AWS (+ Terraform)
        uses: dropstat-org/gha-actions-core-lib/.github/actions/setup-terraform@main
        with:
          aws-role-arn: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          session-name: GitHubActions-cd-deploy
          terraform-version: ${{ needs.config.outputs.tools_terraform }}
          terragrunt-version: ${{ needs.config.outputs.tools_terragrunt }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      - uses: dropstat-org/gha-actions-core-lib@main
        with:
          stage: deploy
        env:
          PIPELINE_REF: ${{ needs.config.outputs.resolved_ref || inputs.deploy_ref }}
          # Admin token for terraform repos that manage GitHub resources (github-org);
          # falls back to the default token (also fine for gh run download).
          GITHUB_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          # Age private key for SopsLoader to decrypt *.secrets.yaml files at the
          # repo root (e.g. github-org sources TF_VAR_sonar_token from SOPS).
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID || vars.AWS_ACCOUNT_ID }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_IMAGE_ORG: ${{ vars.ECR_IMAGE_ORG }}
          AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-2' }}

  # ── ECS Deploy ────────────────────────────────────────────────────────────────

  ecs_deploy:
    name: ECS Deploy
    # Sin cancel: dos applies al mismo ambiente se serializan, no se descartan.
    concurrency:
      group: cd-deploy-${{ github.repository }}-${{ needs.config.outputs.deploy_environment }}
    needs: [config, approval_app]
    if: |
      always() &&
      needs.config.outputs.ecs_deploy_enabled == 'true' &&
      (needs.approval_app.result == 'success' || needs.approval_app.result == 'skipped')
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    environment: ${{ needs.config.outputs.deploy_environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.deploy_ref }}
          # depth 2 exposes a merge commit's parents so the library can resolve the
          # image sha from the merged feature tip (resolveImageSHA -> 2nd parent).
          # depth 1 grafts HEAD as a root and hides parents -> wrong sha (merge commit).
          fetch-depth: 0
      - name: Setup AWS credentials
        uses: dropstat-org/gha-actions-core-lib/.github/actions/setup-terraform@main
        with:
          aws-role-arn: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          session-name: GitHubActions-cd-ecs-deploy
          terraform-version: ${{ needs.config.outputs.tools_terraform }}
          terragrunt-version: ${{ needs.config.outputs.tools_terragrunt }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      - uses: dropstat-org/gha-actions-core-lib@main
        with:
          stage: ecs_deploy
        env:
          PIPELINE_REF: ${{ needs.config.outputs.resolved_ref || inputs.deploy_ref }}
          # The config job already resolved the final target env (override-or-branch) —
          # forward it here so ECSDeployStage doesn't re-derive effectiveEnv from branch
          # alone in this separate job, where DEPLOY_ENVIRONMENT_OVERRIDE would otherwise
          # be empty and silently fall back to branch routing (e.g. main -> prod even
          # when a workflow_dispatch explicitly selected 'qa').
          DEPLOY_ENVIRONMENT_OVERRIDE: ${{ needs.config.outputs.deploy_environment }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID || vars.AWS_ACCOUNT_ID }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_IMAGE_ORG: ${{ vars.ECR_IMAGE_ORG }}
          ECS_DEPLOY_ROLE: ${{ vars.ECS_DEPLOY_ROLE }}
          # Lets action.yaml's ecs_deploy block use $ECS_CLUSTER/$ECS_SERVICE/$ECS_CONTAINER
          # (ECSDeployStage.resolve()) — dropped from this job when ecs_deploy_qa was
          # removed in ad52feb; this is now the only job serving dev+qa, so it needs them.
          # Not real secrets (infra identifiers, readable via `aws ecs describe-services`);
          # sourced from GitHub Actions vars, not secrets.
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          ECS_CONTAINER: ${{ vars.ECS_CONTAINER }}
          ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
          SHA_TAG: ${{ inputs.sha_tag }}
          # Opt-in per repo: bypass the prod-account guard (test repos that deploy
          # prod->dev). Empty for normal repos, so the guard stays on.
          DEPLOY_SKIP_ACCOUNT_CHECK: ${{ vars.DEPLOY_SKIP_ACCOUNT_CHECK }}
          FORCE_BUILD_OVERRIDE: ${{ inputs.force_build }}

  # ── S3 Deploy: static frontend (S3 sync + CloudFront invalidation) ───────────
  # Build-once: downloads the dist artifact built in CI and syncs it to the env's
  # bucket. Env routed by branch (develop→dev, release/*→qa, main→prod); targets in
  # deploy.yaml. GITHUB_TOKEN is needed for the gh run download of the CI artifact.
  s3_deploy:
    name: S3 Deploy
    # Sin cancel: dos applies al mismo ambiente se serializan, no se descartan.
    concurrency:
      group: cd-deploy-${{ github.repository }}-${{ needs.config.outputs.deploy_environment }}
    needs: [config, approval_app]
    if: |
      always() &&
      needs.config.outputs.s3_deploy_enabled == 'true' &&
      (needs.approval_app.result == 'success' || needs.approval_app.result == 'skipped')
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 30
    environment: ${{ needs.config.outputs.deploy_environment }}
    permissions:
      id-token: write
      # write, not read: after a uat deploy this job records the promotion
      # evidence as the tag uat-deployed/<runId> (S3PromotionEvidence), which the
      # prod gate then requires. With contents:read the deploy succeeds and the
      # tag POST comes back 403, leaving a build that can never reach prod.
      # Every caller already declares contents: write, so this does not widen the
      # startup-validated intersection.
      contents: write
      actions:  read   # gh run download of the CI dist artifact
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.deploy_ref }}
          fetch-depth: 0
      - name: Setup AWS credentials
        uses: dropstat-org/gha-actions-core-lib/.github/actions/setup-terraform@main
        with:
          aws-role-arn: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          session-name: GitHubActions-cd-s3-deploy
          terraform-version: ${{ needs.config.outputs.tools_terraform }}
          terragrunt-version: ${{ needs.config.outputs.tools_terragrunt }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      - uses: dropstat-org/gha-actions-core-lib@main
        with:
          stage: s3_deploy
        env:
          PIPELINE_REF: ${{ needs.config.outputs.resolved_ref || inputs.deploy_ref }}
          # See the same env var in the ecs_deploy job above: this job re-derives its
          # own effectiveEnv independently, so the config job's resolved env (override-
          # or-branch) must be forwarded explicitly or a workflow_dispatch override is
          # silently lost and S3DeployStage falls back to branch routing.
          DEPLOY_ENVIRONMENT_OVERRIDE: ${{ needs.config.outputs.deploy_environment }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-2' }}
          # Lets action.yaml's s3_deploy block use $S3_BUCKET/$CF_DISTRIBUTION_ID/$S3_ACL
          # (S3DeployStage.resolve()) instead of deploy.yaml — sourced from GitHub
          # Environment vars, scoped per env by the job's `environment:` gate above.
          # Not secrets (bucket/distribution names, readable via `aws s3api`/`aws cloudfront`).
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CF_DISTRIBUTION_ID: ${{ vars.CF_DISTRIBUTION_ID }}
          S3_ACL: ${{ vars.S3_ACL }}
          # Same idea for action.yaml's s3_deploy.runtime_config, which is written to
          # config.js at deploy time so ONE build-once artifact serves every env (the
          # app reads window.__APP_CONFIG__ instead of build-time baked env vars).
          # Values come from the Terraform-managed GitHub Environment vars/secrets
          # (github-org repo_env_vars / repo_env_config.tf), scoped per env by the
          # job's `environment:` gate above. An unset $VAR fails the deploy rather
          # than shipping the literal placeholder to browsers.
          APP_ENV: ${{ vars.APP_ENV }}
          APP_API_BASE_URL: ${{ vars.APP_API_BASE_URL }}
          APP_API_PROTOCOL: ${{ vars.APP_API_PROTOCOL }}
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
          # Set = pin to that exact CI run (what Trigger CD now always sends, and what
          # a rollback dispatch sets by hand). Empty = S3DeployStage resolves the CI
          # run from SHA_TAG + PIPELINE_REF below, and FAILS if that commit has no
          # successful build - it must never quietly ship a different artifact.
          DEPLOY_ARTIFACT_RUN_ID: ${{ inputs.run_id }}
          # Required for that resolution, and it is what the run-name already claims
          # is being deployed - so the claim is now actually enforced.
          SHA_TAG: ${{ inputs.sha_tag }}
          DEPLOY_SKIP_ACCOUNT_CHECK: ${{ vars.DEPLOY_SKIP_ACCOUNT_CHECK }}

  # ── Release: git tag (terraform) or ECR promotion (app) ──────────────────────
  # Runs AFTER a successful deploy/ecs_deploy so the release tag reflects what
  # was actually applied/deployed, not just what was planned.
  #   terraform → git tag created after apply succeeds
  #   app       → sha promoted to :dev/:qa/:prod in ECR after ECS deploy succeeds

  release:
    name: Release
    needs: [config, deploy, ecs_deploy, s3_deploy]
    if: |
      always() &&
      needs.config.outputs.release_enabled == 'true' &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') &&
      (needs.ecs_deploy.result == 'success' || needs.ecs_deploy.result == 'skipped') &&
      (needs.s3_deploy.result == 'success' || needs.s3_deploy.result == 'skipped') &&
      (needs.deploy.result == 'success' || needs.ecs_deploy.result == 'success' || needs.s3_deploy.result == 'success')
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: write
      # the release stage downloads the deployed dist bundle from the CI run that
      # produced it, and the artifacts API 403s without this
      actions: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.deploy_ref }}
          # depth 2 exposes a merge commit's parents so the library can resolve the
          # image sha from the merged feature tip (resolveImageSHA -> 2nd parent).
          # depth 1 grafts HEAD as a root and hides parents -> wrong sha (merge commit).
          fetch-depth: 0
      - name: Setup AWS credentials
        # Terraform release only creates a git tag — no ECR/AWS needed.
        if: needs.config.outputs.ActionsCoreLib_type != 'terraform'
        uses: dropstat-org/gha-actions-core-lib/.github/actions/setup-terraform@main
        with:
          aws-role-arn: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          session-name: GitHubActions-cd-release
          terraform-version: ${{ needs.config.outputs.tools_terraform }}
          terragrunt-version: ${{ needs.config.outputs.tools_terragrunt }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      # After a release from master the library opens the main -> develop back-merge
      # PR, and GITHUB_TOKEN cannot do that: callers grant pull-requests:read, and
      # raising it here is not an option — GitHub validates every `permissions:` a
      # reusable declares at STARTUP, so one new entry kills every caller at once
      # with startup_failure (confirmed live, run 31137007231). An App installation
      # token bypasses the caller's grant entirely. continue-on-error because a repo
      # without the App installed must degrade to a warning, never fail a shipped
      # release.
      - name: Generate app token (back-merge PR)
        id: backmerge-token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CD_APPROVAL_APP_ID }}
          private-key: ${{ secrets.CD_APPROVAL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: dropstat-org/gha-actions-core-lib@main
        with:
          stage: release
        env:
          PIPELINE_REF: ${{ needs.config.outputs.resolved_ref || inputs.deploy_ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKMERGE_TOKEN: ${{ steps.backmerge-token.outputs.token }}
          SHA_TAG: ${{ inputs.sha_tag }}
          # The environment the deploy jobs actually targeted - the same value passed to
          # ecs_deploy/s3_deploy. Without it AppRelease re-derived the environment from
          # the branch, and the two halves of one run disagreed: a hotfix deployed to dev
          # while moving the :prod tag, and a rollback dispatched to dev moved :qa. The
          # deploys were right; the ECR tags lied, and the promotion gate reads the tags.
          DEPLOY_ENVIRONMENT_OVERRIDE: ${{ needs.config.outputs.deploy_environment }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID || vars.AWS_ACCOUNT_ID }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_IMAGE_ORG: ${{ vars.ECR_IMAGE_ORG }}
  post_deploy:
    name: Post Deploy
    needs: [config, deploy, ecs_deploy, release]
    if: |
      always() &&
      needs.config.outputs.post_deploy_enabled == 'true' &&
      needs.deploy.result != 'failure' &&
      needs.ecs_deploy.result != 'failure'
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.deploy_ref }}
          # depth 2 exposes a merge commit's parents so the library can resolve the
          # image sha from the merged feature tip (resolveImageSHA -> 2nd parent).
          # depth 1 grafts HEAD as a root and hides parents -> wrong sha (merge commit).
          fetch-depth: 0
      - uses: dropstat-org/gha-actions-core-lib@main
        with:
          stage: post_deploy
