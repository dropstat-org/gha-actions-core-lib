name: Setup toolchain
description: >-
  Installs the JVM / Flutter toolchain declared in the repo's action.yaml (tools:).
  Every job that RUNS repo commands needs this, not just compile: unit_test and
  linter execute `mvn test` / `./gradlew test` in their own fresh runner, so
  without it they fall back to the runner's default JDK and a repo targeting a
  newer release fails with "release version NN not supported".

inputs:
  java:
    description: "Java version (empty = skip)"
    required: false
    default: ""
  maven:
    description: "Maven version (empty = skip)"
    required: false
    default: ""
  flutter:
    description: "Flutter version (empty = skip)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Java
      if: inputs.java != ''
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java }}

    - name: Setup Maven
      if: inputs.maven != ''
      uses: stCarolas/setup-maven@v5
      with:
        maven-version: ${{ inputs.maven }}

    - name: Setup Flutter
      if: inputs.flutter != ''
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter }}
        cache: true
