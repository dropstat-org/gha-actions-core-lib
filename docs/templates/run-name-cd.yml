# Canonical run-name block for pipeline-cd callers.
#
# WHY THIS LIVES IN THE CALLER (GitHub limitation, cannot be moved to the lib):
# `run-name` is evaluated by GitHub when the run is CREATED, from the caller's
# event context. A reusable workflow's own run-name is IGNORED — the run always
# belongs to (and is named by) the caller. There is also no API to rename a run
# after it starts. So every repo copies this block verbatim into its
# .github/workflows/pipeline-cd.yml; treat THIS file as the source of truth.
#
# Shows TARGET ENV + ARTIFACT in every case:
#   manual   → Manual deploy → {env} · {sha_tag} · @{actor}
#   auto-CI  → Auto deploy {branch} → dev · sha-{sha} · after CI
#   push     → Deploy {branch} → {env} · sha-{sha} · {commit message}
# The push env is display-only, derived from the branch with the same rules the
# lib uses for real routing (develop→dev, release/**→qa, main|master→prod).
# Repos without the workflow_run auto-chain trigger can drop that middle case.

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Manual deploy → {0} · {1} · @{2}', github.event.inputs.environment, github.event.inputs.sha_tag || 'commit', github.actor)
      || (github.event_name == 'workflow_run'
          && format('Auto deploy {0} → dev · sha-{1} · after CI', github.event.workflow_run.head_branch, github.event.workflow_run.head_sha)
          || format('Deploy {0} → {1} · sha-{2} · {3}',
               github.ref_name,
               (github.ref_name == 'main' || github.ref_name == 'master') && 'prod' || (startsWith(github.ref_name, 'release/') && 'qa' || 'dev'),
               github.sha,
               github.event.head_commit.message)) }}
