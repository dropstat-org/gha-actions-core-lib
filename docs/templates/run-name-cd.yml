# Canonical run-name block for pipeline-cd callers.
#
# WHY THIS LIVES IN THE CALLER (GitHub limitation, cannot be moved to the lib):
# `run-name` is evaluated by GitHub when the run is CREATED, from the caller's
# event context. A reusable workflow's own run-name is IGNORED — the run always
# belongs to (and is named by) the caller. There is also no API to rename a run
# after it starts. So every repo copies this block verbatim into its
# .github/workflows/pipeline-cd.yml; treat THIS file as the source of truth.
#
# Shows TARGET ENV in every case, kept SHORT (GitHub expressions cannot
# truncate the 40-char sha, so the full sha stays OUT of the title — the exact
# artifact is in the run's commit link and in the deploy job summary).
#
# NEVER interpolate `github.sha` or `workflow_run.head_sha` here, not even as the
# `sha_tag ||` fallback: at 40 chars they push the env and the branch — the two
# things this title exists for — off the end of the row. Use a literal ('commit').
# `sha_tag` itself is safe: TriggerCdStage dispatches it as `sha-<7>`, the same
# short form PublishStage tags in ECR. check-run-name.py enforces both invariants.
#
#   manual   → Deploy → {env} · {sha_tag} · @{actor}   (sha_tag is already short)
#   auto-CI  → Deploy {branch} → dev · after CI
#   push     → Deploy {branch} → {env} · {commit message}
# The push env is display-only, derived from the branch with the same rules the
# lib uses for real routing (develop→dev, release/**→qa, main|master→prod).
# Repos without the workflow_run auto-chain trigger can drop that middle case.

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Deploy → {0} · {1} · @{2}', github.event.inputs.environment, github.event.inputs.sha_tag || 'commit', github.actor)
      || (github.event_name == 'workflow_run'
          && format('Deploy {0} → dev · after CI', github.event.workflow_run.head_branch)
          || format('Deploy {0} → {1} · {2}',
               github.ref_name,
               (github.ref_name == 'main' || github.ref_name == 'master') && 'prod' || (startsWith(github.ref_name, 'release/') && 'qa' || 'dev'),
               github.event.head_commit.message)) }}
